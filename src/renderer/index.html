<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- A strict CSP with no network origins: even if a dependency tried to fetch,
       the renderer itself forbids it. 'self' only, no inline scripts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VERIDEX — Advanced All-in-One Windows PC &amp; Laptop Diagnostics</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="vx-app">
    <div class="vx-loading" id="boot">
      <div class="vx-loading__mark" aria-hidden="true"></div>
      <p>Starting VERIDEX…</p>
    </div>
  </div>

  <!-- The bridge is injected by the preload. In a plain browser (used for design
       review) it is absent, and app.js falls back to an explicitly-labelled
       preview harness rather than pretending the product is running. -->
  <script type="module" src="./app.js"></script>
</body>
</html>
